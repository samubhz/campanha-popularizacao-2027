<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campanha de Popularização Teatro &amp; Dança 2027</title>
  <meta name="description" content="Programação completa da Campanha de Popularização Teatro & Dança: busque espetáculos, veja o que acontece hoje, compre ingressos e abra o teatro no Waze.">
  <meta name="theme-color" content="#1b0f0a">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="aviso-exemplo" class="aviso-exemplo" hidden>
    Versão de demonstração: os espetáculos abaixo são exemplos. Troque os arquivos em <code>data/</code> pela programação oficial.
  </div>

  <header class="hero">
    <img src="assets/logo-campanha.webp" width="900" height="398" alt="52ª Campanha de Popularização Teatro &amp; Dança" class="hero-img">
    <p class="hero-datas" id="hero-datas"></p>
    <p class="hero-sub">Teatro adulto · Teatro infantil · Dança · Stand-up · Projetos especiais</p>
    <a class="btn-pdf" href="programa-campanha-2027.pdf" download data-track="pdf" data-local="topo">⬇ Baixar o programa em PDF (para o celular)</a>
  </header>

  <nav class="topbar" aria-label="Seções">
    <button class="tab" data-view="espetaculos" aria-pressed="true">Espetáculos</button>
    <button class="tab" data-view="teatros" aria-pressed="false">Teatros</button>
    <button class="tab" data-view="ingressos" aria-pressed="false">Ingressos</button>
    <a class="tab-pdf" href="programa-campanha-2027.pdf" download data-track="pdf" data-local="menu">⬇ PDF</a>
  </nav>

  <section class="filtros" id="filtros">
    <div class="busca">
      <input id="busca" type="search" placeholder="Buscar espetáculo, teatro, ator, gênero…" autocomplete="off" aria-label="Buscar">
    </div>
    <div class="chips" id="cats" role="group" aria-label="Categorias"></div>
    <div class="dias-wrap" id="dias-wrap">
      <div class="dias-topo">
        <button class="chip chip-hoje" id="btn-hoje">Hoje</button>
        <button class="chip" id="btn-amanha">Amanhã</button>
        <button class="chip" id="btn-todos-dias">Todos os dias</button>
      </div>
      <div class="dias" id="dias" role="group" aria-label="Escolha o dia"></div>
    </div>
    <details class="mais" id="mais"><summary>Mais filtros</summary>
    <div class="selects" id="selects">
      <select id="sel-teatro" aria-label="Teatro"></select>
      <select id="sel-genero" aria-label="Gênero"></select>
      <label class="check"><input type="checkbox" id="chk-acess"> Com Libras / audiodescrição</label>
    </div></details>
  </section>

  <p class="aviso" id="aviso" role="status" hidden></p>
  <p class="resumo" id="resumo" aria-live="polite"></p>
  <main id="lista" class="main"></main>

  <footer class="rodape" id="rodape"></footer>

  <dialog id="dlg" aria-labelledby="dlg-titulo"></dialog>
  <script src="app.js?v=5"></script>
</body>
</html>
